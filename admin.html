<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrador - Quiniela Mundial 2026</title>
</head>
<body>

<h1>Panel de Administración</h1>

<h2>Participantes</h2>

<table border="1" cellpadding="5">
<thead>
<tr>
<th>Nombre</th>
<th>Pagado</th>
</tr>
</thead>
<tbody id="tablaParticipantes">
</tbody>
</table>

<script type="module">

import { db } from "./firestore.js";

import {
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

async function cargarParticipantes() {

  const tabla =
    document.getElementById("tablaParticipantes");

  tabla.innerHTML = "";

  const querySnapshot =
    await getDocs(collection(db, "participantes"));

  querySnapshot.forEach((documento) => {

    const datos = documento.data();

    const fila =
      document.createElement("tr");

    fila.innerHTML = `
      <td>${datos.nombre}</td>
      <td>
        <input
          type="checkbox"
          ${datos.pagado ? "checked" : ""}
          data-id="${documento.id}">
      </td>
    `;

    tabla.appendChild(fila);

  });

  document
    .querySelectorAll("input[type=checkbox]")
    .forEach((checkbox) => {

      checkbox.addEventListener(
        "change",
        async (e) => {

          const id =
            e.target.dataset.id;

          await updateDoc(
            doc(db, "participantes", id),
            {
              pagado: e.target.checked
            }
          );

        }
      );

    });

}

cargarParticipantes();

</script>

</body>
</html>
